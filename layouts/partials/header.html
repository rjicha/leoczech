<nav class="navbar">
  <div class="navbar-inner">
    <a class="navbar-brand" href="{{ .Site.Home.RelPermalink }}">
      <img src="{{ "images/logo.gif" | relURL }}" alt="LeoCzech logo">
      LeoCzech spol. s r.o.
    </a>

    <input type="checkbox" id="menu-toggle" class="menu-toggle" aria-hidden="true">
    <label for="menu-toggle" class="menu-toggle-label" aria-label="Menu">
      <span></span>
    </label>

    <ul class="navbar-nav">
      {{ range .Site.Menus.main }}
        <li><a href="{{ .URL }}">{{ .Name }}</a></li>
      {{ end }}
      {{ with .AllTranslations }}
        <li class="lang-switcher">
          {{ range . }}
            {{ $active := eq .Language.Lang $.Language.Lang }}
            <a href="{{ .RelPermalink }}" class="lang-option{{ if $active }} active{{ end }}"{{ if $active }} aria-current="true"{{ end }} hreflang="{{ .Language.Lang }}">{{ strings.ToUpper .Language.Lang }}</a>
          {{ end }}
        </li>
      {{ end }}
    </ul>
  </div>
</nav>
