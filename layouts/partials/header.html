<nav class="navbar">
  <div class="navbar-inner">
    <a class="navbar-brand" href="{{ .Site.Home.RelPermalink }}">
      <img src="{{ "images/logo.gif" | relURL }}" alt="LeoCzech logo">
      LeoCzech spol. s r.o.
    </a>

    <input type="checkbox" id="menu-toggle" class="menu-toggle" aria-hidden="true">
    <label for="menu-toggle" class="menu-toggle-label" aria-label="Menu">
      <span></span>
    </label>

    <ul class="navbar-nav">
      {{ range .Site.Menus.main }}
        <li><a href="{{ .URL }}">{{ .Name }}</a></li>
      {{ end }}
      {{ if .IsTranslated }}
        <li class="nav-lang">
          <details class="lang-picker">
            <summary aria-label="{{ .Language.Label }}">
              <svg class="lang-globe" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="10"/><line x1="2" y1="12" x2="22" y2="12"/><path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"/></svg>
              <span>{{ .Language.Lang | upper }}</span>
            </summary>
            <ul class="lang-menu">
              {{ range .AllTranslations }}
                <li>
                  <a href="{{ .RelPermalink }}"{{ if eq .Language.Lang $.Language.Lang }} class="active" aria-current="page"{{ end }}>{{ .Language.Label }}</a>
                </li>
              {{ end }}
            </ul>
          </details>
        </li>
      {{ end }}
    </ul>
  </div>
</nav>
