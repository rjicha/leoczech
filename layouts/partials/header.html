<nav class="navbar">
  <div class="navbar-inner">
    <a class="navbar-brand" href="{{ .Site.Home.RelPermalink }}">
      <img src="/images/logo.gif" alt="LeoCzech logo">
      LeoCzech spol. s r.o.
    </a>

    <input type="checkbox" id="menu-toggle" class="menu-toggle" aria-hidden="true">
    <label for="menu-toggle" class="menu-toggle-label" aria-label="Menu">
      <span></span>
    </label>

    <ul class="navbar-nav">
      {{ range .Site.Menus.main }}
        <li><a href="{{ .URL }}">{{ .Name }}</a></li>
      {{ end }}
      {{ if .IsTranslated }}
        {{ range .Translations }}
          <li><a href="{{ .RelPermalink }}" class="lang-switch">{{ .Language.Label }}</a></li>
        {{ end }}
      {{ end }}
    </ul>
  </div>
</nav>
