<nav class="navbar">
  <div class="navbar-inner">
    <a class="navbar-brand" href="{{ .Site.Home.RelPermalink }}">
      <img src="{{ "images/logo.gif" | relURL }}" alt="LeoCzech logo">
      LeoCzech spol. s r.o.
    </a>

    <input type="checkbox" id="menu-toggle" class="menu-toggle" aria-hidden="true">
    <label for="menu-toggle" class="menu-toggle-label" aria-label="Menu">
      <span></span>
    </label>

    <ul class="navbar-nav">
      {{ range .Site.Menus.main }}
        <li><a href="{{ .URL }}">{{ .Name }}</a></li>
      {{ end }}
      <li class="lang-switcher">
        {{ range .AllTranslations }}
          {{ if eq .Language.Lang $.Language.Lang }}
            <span class="lang-option active">{{ .Language.Lang | upper }}</span>
          {{ else }}
            <a href="{{ .RelPermalink }}" class="lang-option">{{ .Language.Lang | upper }}</a>
          {{ end }}
        {{ end }}
      </li>
    </ul>
  </div>
</nav>
