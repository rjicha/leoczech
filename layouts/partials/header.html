<nav class="navbar">
  <div class="navbar-inner">
    <a class="navbar-brand" href="{{ .Site.Home.RelPermalink }}">
      <img src="{{ "images/logo.gif" | relURL }}" alt="LeoCzech logo">
      LeoCzech spol. s r.o.
    </a>

    <input type="checkbox" id="menu-toggle" class="menu-toggle" aria-hidden="true">
    <label for="menu-toggle" class="menu-toggle-label" aria-label="Menu">
      <span></span>
    </label>

    <ul class="navbar-nav">
      {{ range .Site.Menus.main }}
        <li><a href="{{ .URL }}">{{ .Name }}</a></li>
      {{ end }}
      {{ if .IsTranslated }}
        <li class="lang-switch">
          {{ range .AllTranslations }}
            <a href="{{ .RelPermalink }}"{{ if eq .Language.Lang $.Language.Lang }} class="is-active" aria-current="page"{{ end }}>{{ .Language.Lang | upper }}</a>
          {{ end }}
        </li>
      {{ end }}
    </ul>
  </div>
</nav>
