name: AI Issue Implementer

on:
  issues:
    types: [labeled]

jobs:
  implement:
    if: github.event.label.name == 'automate'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Setup Hugo
        uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: 'latest'
          extended: true

      - name: Install Claude Code
        run: npm install -g @anthropic-ai/claude-code

      - name: Run Claude Code
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ISSUE_TITLE: ${{ github.event.issue.title }}
          ISSUE_BODY: ${{ github.event.issue.body }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: |
          SLUG=$(echo "$ISSUE_TITLE" | tr '[:upper:]' '[:lower:]' | sed 's/[^a-z0-9]/-/g' | sed 's/--*/-/g' | sed 's/^-//;s/-$//' | cut -c1-40)
          BRANCH_NAME="feature/${ISSUE_NUMBER}-${SLUG}"
          SPEC_FILE="docs/specs/${ISSUE_NUMBER}-${SLUG}.md"
          git fetch origin "$BRANCH_NAME" 2>/dev/null && git push origin --delete "$BRANCH_NAME" || true
          git checkout -b "$BRANCH_NAME"

          claude -p --dangerously-skip-permissions "You are implementing a feature for the LeoCzech Hugo website. Read CLAUDE.md for project conventions and workflow instructions.

          A user has requested this change via GitHub issue #${ISSUE_NUMBER}:

          Title: ${ISSUE_TITLE}

          Description:
          ${ISSUE_BODY}

          Follow these steps:
          1. Write a spec to ${SPEC_FILE} following the template in docs/specs/_template.md
          2. Implement the changes described in the spec
          3. Run 'hugo --minify' to verify the build succeeds
          4. If the build fails, fix the issues and re-run until it passes

          Use the naming conventions from CLAUDE.md. Make targeted, minimal changes."

          git add -A
          git diff --cached --quiet && echo "No changes made" && exit 0

          git commit -m "feat: ${ISSUE_TITLE} (#${ISSUE_NUMBER})"

          git push origin "$BRANCH_NAME"

      - name: Create Pull Request
        id: create-pr
        if: success()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          ISSUE_TITLE: ${{ github.event.issue.title }}
        run: |
          SLUG=$(echo "$ISSUE_TITLE" | tr '[:upper:]' '[:lower:]' | sed 's/[^a-z0-9]/-/g' | sed 's/--*/-/g' | sed 's/^-//;s/-$//' | cut -c1-40)
          BRANCH_NAME="feature/${ISSUE_NUMBER}-${SLUG}"
          git rev-parse --verify "origin/$BRANCH_NAME" 2>/dev/null || exit 0

          PR_URL=$(gh pr create \
            --base master \
            --head "$BRANCH_NAME" \
            --title "feat: ${ISSUE_TITLE} (#${ISSUE_NUMBER})" \
            --body "Automated implementation from issue #${ISSUE_NUMBER}.

          Please review the changes before merging.

          Closes #${ISSUE_NUMBER}")

          echo "pr_url=$PR_URL" >> "$GITHUB_OUTPUT"

      - name: Notify email sender
        if: steps.create-pr.outputs.pr_url
        uses: actions/github-script@v7
        env:
          WORKER_URL: ${{ secrets.EMAIL_WORKER_URL }}
          NOTIFY_SECRET: ${{ secrets.EMAIL_NOTIFY_SECRET }}
          PR_URL: ${{ steps.create-pr.outputs.pr_url }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        with:
          script: |
            const issueNumber = parseInt(process.env.ISSUE_NUMBER);
            const prUrl = process.env.PR_URL;
            const prNumber = prUrl.split('/').pop();

            const { data: issue } = await github.rest.issues.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issueNumber,
            });

            const emailMatch = issue.body?.match(/\*\*Original email from:\*\* (.+)/);
            if (!emailMatch) {
              console.log(`Issue #${issueNumber} was not created via email, skipping notification`);
              return;
            }

            const senderEmail = emailMatch[1].trim();
            const langMatch = issue.body?.match(/\*\*Language:\*\* (\w+)/);
            const language = langMatch ? langMatch[1].trim() : 'cs';
            const previewUrl = `https://deploy-preview-${prNumber}--leoczech-preview.netlify.app`;
            const actionsUrl = `${process.env.GITHUB_SERVER_URL}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;

            console.log(`Notifying ${senderEmail} (${language}) about PR #${prNumber} for issue #${issueNumber}`);

            const response = await fetch(process.env.WORKER_URL + '/notify', {
              method: 'POST',
              headers: {
                'Content-Type': 'application/json',
                'Authorization': `Bearer ${process.env.NOTIFY_SECRET}`,
              },
              body: JSON.stringify({
                type: 'preview',
                to: senderEmail,
                issueNumber: issueNumber,
                issueTitle: issue.title,
                prUrl: prUrl,
                previewUrl: previewUrl,
                actionsUrl: actionsUrl,
                language: language,
              }),
            });

            if (!response.ok) {
              console.error(`Failed to notify: ${response.status} ${await response.text()}`);
            } else {
              console.log('Notification sent successfully');
            }
